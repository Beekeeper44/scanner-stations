<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Club Admin — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --nav-bg:#000;--nav-active:#52c94f;--purple:#8b5cf6;--pill-purple:#7e4fc4;--start-green:#4a7c3f;
  --red:#e8352b;--green:#52c94f;--blue:#1565d8;--log-bg:#d5f6fc;
  --page:#fff;--ink:#111318;--muted:#5f6772;--line:#e0e0e0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav-bg);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 18px}
.logo{width:38px;height:38px;flex:none;border:2px solid #fff;border-radius:4px;display:grid;place-content:center;line-height:.95;text-align:center;font-size:7px;font-weight:800;letter-spacing:.04em;background:none;color:#fff;padding:0}
.logo span{display:block;font-size:5px;font-weight:600}
.navlinks{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navbtn{background:none;border:0;color:#fff;font-weight:700;font-size:15px;padding:10px 12px;border-radius:6px;white-space:nowrap}
.navbtn:hover{background:#1c1c1c}
.navbtn.dim{color:#7a7f87;cursor:default}
.navbtn.dim:hover{background:none}
.menu button.dim{color:#a8adb5;cursor:default}
.menu button.dim:hover{background:none}
.navbtn.on{color:var(--nav-active)}
.navright{display:flex;align-items:center;gap:12px;flex:none;padding-left:10px}
.me{display:flex;align-items:center;gap:12px;background:none;border:0;padding:5px 9px;border-radius:8px;color:#fff}
.me:hover{background:#1c1c1c}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;background-image:radial-gradient(circle at 30% 30%,#c79a63,#5e3f24)}
.who{font-weight:700;font-size:15px}
.points{font-weight:600;font-size:15px;color:#e8e8e8}
.pillbtn{border:0;border-radius:7px;padding:9px 14px;font-weight:700;color:#fff;font-size:14px}
.pillbtn.logout{background:var(--purple)}
.pillbtn.start{background:var(--start-green)}
.pillbtn.start.on{background:#b02a20}
@media (max-width:980px){.who,.points{display:none}}
.menuwrap{position:relative}
.menu{position:fixed;top:0;left:0;min-width:262px;background:#fff;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:6px 0;display:none;z-index:120}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 22px;font-size:16px;color:#1a1a1a;font-weight:500}
.menu button:hover,.menu button.sel{background:#e3e3e3}

/* shell */
main{min-height:70vh;padding:22px 26px 90px}
h1.left{font-size:clamp(30px,3.4vw,42px);font-weight:900;letter-spacing:-.02em;margin:8px 0 22px}
h1.mid{font-size:clamp(34px,5vw,54px);font-weight:900;letter-spacing:-.02em;text-align:center;margin:18px 0 22px}
h2.sec{font-size:18px;font-weight:800;margin:28px 0 12px}
p.note{color:var(--muted);font-size:14px}
.home{padding:34px 0 0 clamp(0px,11vw,290px)}
.home h2{margin:0;font-size:17px;font-weight:800;color:#3b4250}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed #c9ced6;border-radius:8px;margin:18px 0}

/* mui tabs */
.muitabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.muitabs::-webkit-scrollbar{display:none}
.muitab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:14px 4px;font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:9px;white-space:nowrap;text-transform:uppercase}
.muitab.on{color:var(--blue);border-bottom-color:var(--blue)}
.badge{background:#d8dce2;color:#22262c;border-radius:20px;font-size:12px;font-weight:700;padding:2px 9px;letter-spacing:0}
.muitab.on .badge{background:var(--blue);color:#fff}

/* filters */
.filters{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.mui{position:relative;flex:1 1 260px;min-width:210px}
.mui>label{position:absolute;top:-8px;left:11px;background:#fff;padding:0 5px;font-size:12px;color:#6b7280}
.mui select,.mui input{width:100%;padding:17px 13px;font-size:16px;border:1px solid #c4c9d0;border-radius:5px;background:#fff;color:var(--ink);appearance:none}
.mui select{color:#44484f;font-style:italic;background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.mui input::placeholder{color:#6b7280}
.btn-search{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:14px 26px;font-weight:700;letter-spacing:.06em;font-size:14px}
.btn-clear{background:none;border:0;color:#a0a6ae;font-weight:700;letter-spacing:.06em;font-size:14px;padding:14px 18px;border-radius:5px}
.btn-clear:hover{color:var(--muted);background:#f3f5f7}

/* data table */
.tablewrap{overflow-x:auto}
table.dt{width:100%;min-width:1000px;border-collapse:collapse}
table.dt th{background:#fff;border-bottom:1px solid var(--line);padding:16px 12px;font-size:15px;font-weight:800;text-align:left;white-space:nowrap}
table.dt td{border-bottom:1px solid #eceef1;padding:13px 12px;font-size:15px;vertical-align:middle}
table.dt tbody tr:hover{background:#f6f7f8}
.boxbtn{border:1px solid #bcd3f5;background:#fff;color:var(--blue);border-radius:5px;padding:9px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.boxbtn:hover{background:#eef4ff}
.olink{color:var(--blue);font-weight:500;background:none;border:0;padding:0;font-size:15px;text-align:left}
.olink:hover{text-decoration:underline}
.datechip{display:inline-flex;align-items:center;gap:9px;border:1px solid #e0b4b0;color:#c0392b;border-radius:5px;padding:9px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.datechip.fine{border-color:#c4c9d0;color:#3a3f46}
.overdue{display:inline-block;background:#c0392b;color:#fff;border-radius:20px;padding:6px 13px;font-weight:700;font-size:13px;margin-left:10px;white-space:nowrap}

.actbtn{background:#52c94f;color:#0d2b06;border:0;border-radius:20px;padding:8px 20px;font-weight:800;font-size:14px;white-space:nowrap}
.actbtn:hover{background:#45b342}
.actbtn.blue{background:var(--blue)}.actbtn.blue:hover{background:#0f4fae}
.actbtn.grey{background:#41464e}.actbtn.grey:hover{background:#2b2f35}
.tag{display:inline-block;padding:4px 11px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcf5e3;color:#14562f}
.tag.warn{background:#fdecc8;color:#6a4900}
.tag.err{background:#fadad7;color:#7a1c14}
.tag.info{background:#dce8fb;color:#123a77}
.tag.grey{background:#e7e9ec;color:#3a3f46}

/* graders */
.field{position:relative;margin:0 auto 26px;max-width:800px}
.field input{width:100%;padding:20px 14px;font-size:16px;border:2px solid var(--blue);border-radius:6px;background:#fff;color:var(--ink)}
.field label{position:absolute;top:-9px;left:12px;background:#fff;padding:0 6px;font-size:13px;color:var(--blue)}
.gtable{max-width:820px;margin:0 auto;border-top:1px solid var(--line)}
.ghead{display:grid;grid-template-columns:1.35fr .9fr;gap:10px;padding:14px 8px;border-bottom:1px solid var(--line);font-weight:800}
.grow{display:grid;grid-template-columns:1.35fr .9fr;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.gpill{display:flex;align-items:center;gap:12px;background:var(--pill-purple);color:#111;border:0;border-radius:26px;padding:12px 18px;margin:7px 0;width:100%;text-align:left}
.gpill:hover{filter:brightness(1.07)}
.gpill .ini{width:38px;height:38px;border-radius:50%;background:#cfe6cd;display:grid;place-content:center;font-weight:800;font-size:13px;flex:none}
.gpill b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.gpill small{font-size:14px;color:#2f2f35;opacity:.85}
.gdate{font-size:15px;padding-left:6px}
@media (max-width:640px){.ghead,.grow{grid-template-columns:1fr}.ghead span:last-child{display:none}.gdate{padding:0 0 10px 18px;font-size:13px}}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px}
.skill{border:0;border-radius:8px;padding:14px 12px;min-height:68px;font-weight:800;font-size:15px;text-align:left;line-height:1.2;display:flex;align-items:flex-start}
.skill.off{background:var(--red);color:#fff}
.skill.on{background:var(--green);color:#10240d}
.skill:hover{filter:brightness(1.06)}
.skill.flag{box-shadow:inset 0 0 0 3px #111}
.legend{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 18px;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.log{background:var(--log-bg);border-radius:6px;padding:20px 22px;margin-top:26px}
.log .item{padding:10px 0 16px}
.log .item+.item{border-top:1px solid rgba(0,0,0,.08)}
.log h3{margin:0 0 6px;font-size:19px;font-weight:800}
.log .bullet{margin:0 0 4px;font-weight:700;font-size:15px;word-break:break-all}
.log .ts{margin:0;font-size:13px;font-weight:600;color:#1d2b2f}

/* hardware table + stations */
.segmented{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:20px}
.segmented button{background:#fff;border:0;padding:10px 18px;font-weight:700;font-size:14px;color:var(--muted)}
.segmented button+button{border-left:1px solid var(--line)}
.segmented button.on{background:#111;color:#fff}
.btn-out{border:1px solid #c4c9d0;background:#fff;color:#2b2f35;border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px;margin-right:8px}
.btn-out:hover{background:#f3f5f7}
.btn-out.red{border-color:#e8a19b;color:#c0392b}
.btn-out.red:hover{background:#fdf1f0}
.btn-out.green{border-color:#9fd3a4;color:#2b7a3d}
.btn-out.green:hover{background:#f0faf1}
.btn-add{border:1px solid #9fd3a4;background:#fff;color:#2b7a3d;border-radius:6px;padding:13px 20px;font-weight:700;font-size:14px}
.btn-add:hover{background:#f0faf1}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;z-index:120;padding:20px}
.sheet{background:#fff;border-radius:12px;padding:24px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h3{margin:0 0 20px;font-size:20px;font-weight:800}
.sheetbar{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.sheetbar .btn-out{margin:0}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.stcard{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:14px 14px 16px;box-shadow:0 2px 10px rgba(16,20,28,.06)}
.stcard h4{margin:0 0 12px;font-size:19px;font-weight:800;text-align:center}
.stcard{position:relative}
.stcard[data-card]{cursor:pointer}
.delst{position:absolute;top:8px;right:8px;background:none;border:0;font-size:20px;line-height:1;color:#b9bec6;padding:2px 6px;border-radius:6px}
.delst:hover{color:#c0392b;background:#fdf1f0}
.stcard[data-card]:hover{border-color:#c9ced6}
.disclose{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:6px 2px 0;font-size:13px;color:var(--muted);font-weight:600}
.disclose:hover{color:var(--ink)}
.disclose i{font-style:normal;font-size:12px}
.stlist{margin-top:10px}
.stlist .strow{cursor:default}
/* scan station */
.backlink{background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;padding:0 0 14px}
.backlink:hover{text-decoration:underline}
.station{display:grid;grid-template-columns:minmax(290px,.95fr) minmax(300px,1.05fr);gap:16px;align-items:stretch;background:#ececec;border-radius:10px;padding:18px;margin-bottom:22px}
@media (max-width:1100px){.station{grid-template-columns:1fr}}
.spage{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.42fr);gap:18px;align-items:start}
@media (max-width:1100px){.spage{grid-template-columns:1fr}}
.sleft{min-width:0}
.spage .preview{position:sticky;top:96px;height:calc(100vh - 150px);min-height:420px}
.stpanel{background:#f6f6f6;border-radius:8px;padding:14px;display:flex;flex-direction:column;overflow:visible}
.toggleline{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:12px}
.toprow{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.toprow .toggleline{margin:0 0 6px;flex:none}
.toprow .ctlfield{flex:1 1 220px;margin-bottom:0}
.toggle{width:62px;height:32px;border-radius:20px;background:#c9ced6;border:0;position:relative;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:#52c94f}
.toggle.on i{left:33px}
.ctlrow{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-end}
.ctlfield{display:flex;flex-direction:column;gap:5px;flex:1 1 200px}
.ctlfield.grow0{flex:0 1 190px}
.ctlfield span{font-size:12px;font-weight:700;color:var(--muted)}
.ctlsel.static{display:flex;align-items:center;justify-content:center;border-radius:6px}
.stationline{margin:8px 0 10px;font-size:16px;font-weight:800}
.minilbl{margin:0 0 8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}

.scrow{display:flex;align-items:center;gap:6px;background:#eef4ff;border:1px solid #c5d8f7;border-radius:8px;padding:7px 10px;margin-bottom:6px}
.scrow .nm{flex:1 1 50%;min-width:0;font-weight:700;color:#1b4b9c;font-size:15px}
.scrow .mini{flex:1 1 25%;margin-right:0;min-width:0;padding:9px 6px}
.scrow .nm em{display:block;font-style:normal;font-size:11px;font-weight:600;color:#5f6772}
.mini.scan{background:#52c94f;color:#0d2b06}
.printerbox{border:1px solid #dfe3e8;border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:12px}
.ctlfield{display:flex;flex-direction:column;gap:5px;margin-bottom:4px}
.bay h5 em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
.bay{cursor:pointer;border-radius:6px;padding:4px;display:flex;flex-direction:column;min-height:0}
.bay.picked{background:#e6f7e4;outline:2px solid #a9dda4}
.tray{position:relative;overflow:hidden}
.sweep{position:absolute;left:0;right:0;top:-18px;height:16px;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(180deg,rgba(82,201,79,0),rgba(82,201,79,.98),rgba(82,201,79,0));
  box-shadow:0 0 22px 8px rgba(82,201,79,.8)}
.bay.scanning .sweep{animation:sweep 6s cubic-bezier(.4,0,.6,1) 1}
.bay.scanning .tray{box-shadow:inset 0 0 0 2px #52c94f}
@keyframes sweep{
  0%{top:-18px;opacity:0}
  6%{opacity:1}
  94%{opacity:1}
  100%{top:100%;opacity:0}
}
.scrow{cursor:pointer}
.scrow.picked{background:#e6f7e4;border-color:#a9dda4;outline:2px solid #52c94f}
.scrow.picked .nm{color:#1c6334}
.scrow.picked .nm em{color:#3f6b3c}
.prevhead{margin:0 0 6px;text-align:center;font-size:15px;font-weight:800}
.pgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:6px}
.pcard span.dim{background:none;border:0;color:#8b9099;font-weight:600;font-size:12px}
.pcard{position:relative;overflow:hidden}
.pctl{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;z-index:3;opacity:0;transition:opacity .1s}
.pcard:hover .pctl,.pcard.need .pctl{opacity:1}
.pctl button{flex:1;border:0;border-radius:4px;padding:5px 2px;font-size:11px;font-weight:800;background:rgba(255,255,255,.94);color:#2b2f35}
.pctl button:nth-child(2){background:#52c94f;color:#0d2b06}
.pctl button:nth-child(3){background:#f7e976;color:#2b2f35}
.pctl button:disabled{opacity:.5}
.pcard.need{outline:2px solid #e0473b}
.pcard.need span b{color:#e0473b}
.pcard .sweep{position:absolute;left:0;right:0;top:-18px;height:16px;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(180deg,rgba(82,201,79,0),rgba(82,201,79,.98),rgba(82,201,79,0));
  box-shadow:0 0 22px 8px rgba(82,201,79,.8)}
.pcard.scanning .sweep{animation:sweep 2.2s linear 1}
.pcard:not(.filled){background:linear-gradient(#efefef,#dedede)}

.ctlfield .ctlsel{flex:none}

.ctlsel{flex:1 1 180px;padding:11px 12px;border:1px solid #c4c9d0;border-radius:6px;font-size:16px;background:#fff;color:var(--ink)}
.ctlsel.blue{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700;flex:0 1 210px}
.ctlgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:8px}
.bigbtn{border:0;border-radius:6px;padding:13px 10px;font-weight:800;font-size:14px;letter-spacing:.02em}
.bigbtn.green{background:#52c94f;color:#0d2b06}
.bigbtn.yellow{background:#f7e976;color:#2b2f35}
.bigbtn.blue{background:var(--blue);color:#fff}
.bigbtn.ghost{background:#fff;border:1px solid #d4d8de;color:#2b2f35}
.bigbtn.sm{padding:10px 18px;font-size:14px}
.bigbtn:disabled{opacity:.6}
.bays{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:stretch}
.bay h5{margin:0 0 8px;text-align:center;font-size:16px;font-weight:800}
.tray{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:6px;background:#fff;border:1px dashed #b9bec6;padding:8px;border-radius:4px}
.cardslot{min-height:70px;border:1px dotted #b9bec6;background:linear-gradient(#d9d9d9,#c2c2c2);display:grid;place-items:center;font-size:8px;text-align:center;color:#2b2f35;padding:2px}
.cardslot.filled{background:linear-gradient(#111,#cfcfcf)}
.cardslot.filled span{background:#e9e9e9;border-radius:3px;padding:2px 3px;font-size:8px;position:relative;z-index:2}
.cardslot{position:relative}
.cardslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.cardslot.shot,.pcard.shot{background:#fff}
.pcard{position:relative}

.preview{background:#fff;border:1px dashed #b9bec6;padding:8px;border-radius:6px;display:flex;flex-direction:column;min-height:0}
.pcard{min-height:90px;background:linear-gradient(#0c0c0c,#c9c9c9);border:1px dotted #9aa1ab;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden}
.pcard span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(233,233,233,.94);
  border-top:1px solid rgba(0,0,0,.12);border-bottom:1px solid rgba(0,0,0,.12);border-radius:0;
  padding:6px 8px;font-size:11px;font-weight:700;text-align:center;z-index:2}
.boxesbar{background:#111;color:#fff;font-weight:700;padding:9px 16px;border-radius:6px;margin-bottom:10px;font-size:14px}
.boxhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#eef4f6;border-radius:6px;padding:10px 14px;margin-bottom:10px}
.boxhead h3{margin:0;font-size:19px;font-weight:900}

/* ===================== state ===================== */
const KEY = "ac-admin-proto-v6";
let store = {skills:{},device:"v850-1",working:false};
try{ const raw = localStorage.getItem(KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
/* a run interrupted by a reload used to leave this flag set, which blocked every later scan */
if(store.scanning){ delete store.scanning; save(); }
function skillsFor(id){
  if(!store.skills[id]) store.skills[id]={};
  const s=store.skills[id];
  SKILLS.forEach(function(x){ if(!(x[0] in s)) s[x[0]] = !!x[1]; });
  return s;
}
function hasSkill(n){ return !!skillsFor(ME)[n]; }

let toastT;
function toast(msg){
  const old=document.querySelector(".toast"); if(old) old.remove();
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(toastT);
  toastT=setTimeout(function(){ el.remove(); },2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function go(h){ location.hash = h; }

/* ===================== nav ===================== */
const navEl = document.getElementById("navlinks");
const view = document.getElementById("view");

function buildNav(){
  TABS.forEach(function(tab){
    if(tab === "Operations" || tab === "Vaulting"){
      const isOps = tab === "Operations";
      const items = isOps ? OPS : VAULT;
      const live  = isOps ? "Scan" : "Revault";
      const href  = isOps ? "#/p/scan" : "#/revault";
      const b=document.createElement("button"); b.className="navbtn"; b.textContent=tab;
      b.setAttribute("aria-haspopup","true");
      const m=document.createElement("div"); m.className="menu"; m.id=(isOps?"opsmenu":"vaultmenu");
      items.forEach(function(o){
        const mb=document.createElement("button"); mb.textContent=o;
        if(o === live){
          mb.dataset.live="1";
          mb.onclick=function(e){ e.stopPropagation(); m.classList.remove("open"); go(href); };
        } else {
          mb.className="dim"; mb.disabled=true;
        }
        m.appendChild(mb);
      });
      b.onclick=function(e){
        e.stopPropagation();
        const open = m.classList.contains("open");
        document.querySelectorAll(".menu.open").forEach(function(x){ x.classList.remove("open"); });
        if(open) return;
        if(!isOps){
          const rv=m.querySelector('[data-live="1"]'), on=hasSkill("Revault");
          if(rv){ rv.className = on ? "" : "dim"; rv.disabled = !on; }
        }
        const r = b.getBoundingClientRect();
        m.style.top = (r.bottom + 8) + "px";
        m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 274)) + "px";
        m.classList.add("open");
      };
      navEl.appendChild(b);
      document.body.appendChild(m);
    } else {
      const b=document.createElement("button"); b.className="navbtn"; b.textContent=tab;
      if(tab !== "Graders"){
        b.classList.add("dim"); b.disabled = true;
      } else {
        b.onclick=function(){
          document.querySelectorAll(".menu.open").forEach(function(x){ x.classList.remove("open"); });
          go("#/graders");
        };
      }
      navEl.appendChild(b);
    }
  });
}

/* ===================== table page ===================== */
function cell(col, v){
  const t = col.t;
  if(t === "box")  return '<button class="boxbtn">'+esc(v)+(/^\d+$/.test(String(v))?" BOXES":"")+'</button>';
  if(t === "link") return '<button class="olink">'+esc(v)+'</button>';
  if(t === "date") return '<span class="datechip'+(v[1]?"":" fine")+'">&#128197; '+esc(v[0])+'</span>'+(v[1]?'<span class="overdue">'+esc(v[1])+'</span>':'');
  if(t === "tag")  return '<span class="tag '+esc(v[1])+'">'+esc(v[0])+'</span>';
  if(t === "act")  return '<button class="actbtn '+(v[1]==="green"?"":esc(v[1]))+'" data-a="'+esc(v[0])+'">'+esc(v[0])+'</button>';
  return esc(v);
}

function viewPage(slug, tabKey){
  const page = PAGES[slug];
  if(!page){ return go("#/graders"); }
  markNav(page.nav, page.nav==="Operations" ? slug : null);

  const tabs = page.tabs.slice();
  (page.extraTabs||[]).forEach(function(x){ if(!x.skill || hasSkill(x.skill)) tabs.push(x); });

  let active = tabs.filter(function(t){ return t.k===tabKey; })[0];
  let locked = false;
  if(!active){
    const hidden = (page.extraTabs||[]).filter(function(x){ return x.k===tabKey; })[0];
    if(hidden){ locked = true; } else { active = tabs[0]; }
  }

  view.innerHTML =
    '<h1 class="left">'+esc(page.title)+'</h1>' +
    '<div class="muitabs">' + tabs.map(function(t){
      return '<button class="muitab'+((!locked && active && t.k===active.k)?" on":"")+'" data-k="'+t.k+'">' +
             esc(t.label)+'<span class="badge">'+esc(t.count)+'</span></button>';
    }).join("") + '</div>' +
    '<div id="body"></div>';

  Array.prototype.forEach.call(view.querySelectorAll(".muitab"),function(b){
    b.onclick=function(){ go("#/p/"+slug+"/"+b.dataset.k); };
  });

  if(locked) return paintLocked();
  if(active.k === "hardware") return paintHardware();
  paintTable(page, active, slug);
}

function paintTable(page, tab, slug){
  const body=document.getElementById("body");
  const f = page.filters||[];
  body.innerHTML =
    '<div class="filters">' + f.map(function(x){
      const flex = x.wide ? ' style="flex:1 1 380px"' : (x.t==="text" ? ' style="flex:1 1 320px"' : '');
      if(x.t==="text") return '<div class="mui"'+flex+'><input id="f-'+x.id+'" placeholder="'+esc(x.ph)+'" autocomplete="off"></div>';
      return '<div class="mui"'+flex+'><label>'+esc(x.label)+'</label><select id="f-'+x.id+'">' +
             x.opts.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join("") + '</select></div>';
    }).join("") +
    '<button class="btn-search" id="f-go">SEARCH</button><button class="btn-clear" id="f-clear">CLEAR</button></div>' +
    '<div class="tablewrap"><table class="dt"><thead><tr>' +
      page.cols.map(function(c){ return '<th>'+c.h+'</th>'; }).join("") +
    '</tr></thead><tbody id="tb"></tbody></table></div>';

  function paint(rows){
    const tb=document.getElementById("tb");
    if(!rows.length){
      tb.innerHTML='<tr><td colspan="'+page.cols.length+'"><div class="empty">No rows match those filters. Clear them to see the full queue.</div></td></tr>';
      return;
    }
    tb.innerHTML = rows.map(function(r){
      return '<tr>'+page.cols.map(function(c,i){ return '<td>'+cell(c,r[i])+'</td>'; }).join("")+'</tr>';
    }).join("");
    Array.prototype.forEach.call(tb.querySelectorAll(".actbtn"),function(b){
      b.onclick=function(){ toast(b.dataset.a+" — prototype stub"); };
    });
    Array.prototype.forEach.call(tb.querySelectorAll(".boxbtn"),function(b,i){
      b.onclick=function(){
        if(slug==="scan"){ go("#/box/"+encodeURIComponent(rows[i][1])); }
        else toast("Opens the box — prototype stub");
      };
    });
    Array.prototype.forEach.call(tb.querySelectorAll(".olink"),function(b){
      b.onclick=function(){ toast("Opens detail — prototype stub"); };
    });
  }
  paint(tab.rows);

  function run(){
    let rows=tab.rows.slice();
    f.forEach(function(x){
      const el=document.getElementById("f-"+x.id); if(!el || x.col===undefined) return;
      const v=el.value.trim();
      if(x.t==="text"){ if(v) rows=rows.filter(function(r){ return String(flat(r[x.col])).toLowerCase().indexOf(v.toLowerCase())>-1; }); }
      else if(v && v!=="Any"){ rows=rows.filter(function(r){ return String(flat(r[x.col])).indexOf(v)>-1 || (Array.isArray(r[r.length-1]) && r[r.length-1][2]===v); }); }
    });
    paint(rows);
  }
  function flat(v){ return Array.isArray(v) ? v.join(" ") : v; }
  document.getElementById("f-go").onclick=run;
  f.forEach(function(x){
    const el=document.getElementById("f-"+x.id); if(!el) return;
    if(x.t==="text") el.onkeydown=function(e){ if(e.key==="Enter") run(); };
    else el.onchange=run;
  });
  document.getElementById("f-clear").onclick=function(){
    f.forEach(function(x){ const el=document.getElementById("f-"+x.id); if(!el) return; if(x.t==="text") el.value=""; else el.selectedIndex=0; });
    paint(tab.rows);
  };
}

    }).map(function(n){

            : '<p class="note" style="text-align:center;margin:6px 0 0">Nothing placed here yet</p>') + '</div>' : '') +
      '</div>';

  document.getElementById("s-user").onchange=function(){ store.suFilter=this.value; save(); paintStationSetup(); };
  document.getElementById("s-add").onclick=function(){ addStation(paintStationSetup); };

      e.stopPropagation();
      const n=Number(el.dataset.user), was=su[n];

/* ---- dialogs ---- */
function modal(title, inner, onSave, saveLabel){
  const wrap=document.createElement("div"); wrap.className="overlay";
  wrap.innerHTML='<div class="sheet"><h3>'+esc(title)+'</h3>'+inner+
    '<div class="sheetbar">' + (onSave?'<button class="btn-out" id="m-cancel">Cancel</button>':'') +
    '<button class="actbtn" id="m-save">'+esc(saveLabel||(onSave?"Save":"Close"))+'</button></div></div>';
  document.body.appendChild(wrap);
  function close(){ wrap.remove(); }
  wrap.onclick=function(e){ if(e.target===wrap) close(); };
  const c=wrap.querySelector("#m-cancel"); if(c) c.onclick=close;
  wrap.querySelector("#m-save").onclick=function(){ if(!onSave || onSave(wrap)!==false) close(); };
  return wrap;
}
function addDialog(done){
  modal("Add hardware",
    '<div class="mui"><label>Name</label><input id="m-name" placeholder="Scanner 33"></div>' +
    '<div class="mui" style="margin-top:18px"><label>Hardware ID</label><input id="m-id" placeholder="serial or device ID"></div>' +

    '</div>',
    function(w){
      const name=w.querySelector("#m-name").value.trim();
      if(!name){ toast("Give the hardware a name"); return false; }
      const st=w.querySelector("#m-station").value.trim();
      hwRecords().push({
        id:"hw"+Date.now(),

function wireDelete(done){
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(el){
    el.onclick=function(e){
      e.stopPropagation();
      const n=Number(el.dataset.del), su=stationUsers(), devs=devicesAt(n);
      modal("Remove Station "+n,
        '<p class="note" style="margin:0">' +
        (su[n] ? esc(su[n])+' is assigned to it. ' : '') +
        (devs.length ? devs.length+' device'+(devs.length===1?"":"s")+' will go back on the shelf.' : 'It has no hardware on it.') +
        '</p>',
        function(){ removeStation(n, done); }, "Remove station");
    };
  });
}

function addStation(done){
  const list=stationList();
  const next=(list.length?Math.max.apply(null,list):0)+1;
  modal("Add a station",
    '<div class="mui"><label>Station number</label><input id="m-n" value="'+next+'" inputmode="numeric"></div>' +
    '<p class="note" style="margin:12px 2px 0">It starts empty — assign a user on Station setup and drag hardware to it on Hardware setup.</p>',
    function(w){
      const n=parseInt(w.querySelector("#m-n").value,10);
      if(!n || n<1){ toast("Use a whole number"); return false; }
      if(list.indexOf(n)>-1){ toast("Station "+n+" already exists"); return false; }
      list.push(n); list.sort(function(a,b){ return a-b; });
      save(); done(); toast("Added Station "+n);
    },"Add station");
}

function removeStation(n, done){
  const list=stationList(), su=stationUsers();
  const freed=devicesAt(n);
  freed.forEach(function(h){ h.station=null; });
  delete su[n];
  store.stations=list.filter(function(x){ return x!==n; });
  save(); done();
  toast("Removed Station "+n+(freed.length?" — "+freed.length+" device"+(freed.length===1?"":"s")+" back on the shelf":""));
}

  const su=stationUsers();
  function taken(name){
    const at=Object.keys(su).filter(function(k){ return su[k]===name && Number(k)!==n; })[0];
    return at ? Number(at) : null;
  }
  const w=modal("Assign a user to Station "+n,

    '<div class="picker" id="u-list"></div>', null, "Close");

    const f=(q.value||"").toLowerCase();

    }).join("") : '<p class="note">No user matches that search.</p>';

/* ---- hardware setup: drag devices onto stations ---- */
function paintHwSetup(){

  const type=store.poolType||"V600";
  const q=(store.poolQ||"").toLowerCase();
  const pool=recs.filter(function(h){
    return !h.station && h.type===type && (!q || h.name.toLowerCase().indexOf(q)>-1);
  });

  document.getElementById("hwbody").innerHTML =
    '<p class="poolhint">Drag a device from the right onto a station. Drag it back to the shelf to free it up. ' +
    'On a touch screen, tap the device then tap the station.</p>' +
    '<div class="dnd">' +
      '<div class="dndleft"><div class="stations">' + stationList().map(function(n){
        const devs=devicesAt(n);
        return '<div class="stcard drop" data-drop="'+n+'"><button class="delst" data-del="'+n+'" title="Remove station">&times;</button><h4>Station '+n+'</h4>' +
          (su[n]?'<p class="stmail">'+esc(su[n])+'</p>':'') +
          devs.map(function(h){
            return '<div class="strow t-'+h.type.toLowerCase()+'" draggable="true" data-id="'+h.id+'">' +
                   (h.type==="Printer"?"Printer ":"")+esc(h.name)+'</div>';
          }).join("") +
          (devs.length?'':'<div class="strow slot">drop hardware here</div>') +
          (STATION_NOTES[n]?'<div class="stnote">'+esc(STATION_NOTES[n])+'</div>':'') +
        '</div>';
      }).join("") + '</div></div>' +
      '<aside class="dndright drop" data-drop="pool">' +
        '<div class="mui" style="margin-bottom:18px"><label>Type</label><select id="p-type">' +
          ["V600","Fuji","Printer"].map(function(o){ return '<option'+(o===type?" selected":"")+'>'+o+'</option>'; }).join("") +
        '</select></div>' +
        '<div class="mui" style="margin-bottom:16px"><input id="p-q" placeholder="Find hardware" value="'+esc(store.poolQ||"")+'"></div>' +
        '<h4 class="shelfhead">On the shelf <span>'+pool.length+'</span></h4>' +
        '<div class="shelf">' + (pool.length ? pool.map(function(h){
            return '<div class="strow t-'+h.type.toLowerCase()+(h.id===store.sel?" sel":"")+'" draggable="true" data-id="'+h.id+'">' +
                   (h.type==="Printer"?"Printer ":"")+esc(h.name)+'</div>';
          }).join("") : '<p class="note">Every '+esc(type)+' is out at a station.</p>') + '</div>' +
        '<button class="btn-add" id="p-hw" style="width:100%;margin-top:16px">+ Add hardware</button>' +
        '<button class="btn-add" id="p-st" style="width:100%;margin-top:10px">+ Add station</button>' +
      '</aside>' +
    '</div>';

  document.getElementById("p-type").onchange=function(){ store.poolType=this.value; store.sel=null; save(); paintHwSetup(); };
  const qi=document.getElementById("p-q");
  qi.oninput=function(){ store.poolQ=this.value; save(); paintHwSetup(); const n=document.getElementById("p-q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  document.getElementById("p-hw").onclick=function(){ addDialog(paintHwSetup); };
  document.getElementById("p-st").onclick=function(){ addStation(paintHwSetup); };
  wireDelete(paintHwSetup);

  function place(id, target){
    const h=recs.filter(function(x){ return x.id===id; })[0]; if(!h) return;
    if(target==="pool"){
      if(!h.station){ return; }
      const was=h.station; h.station=null; save(); paintHwSetup(); toast(h.name+" returned to the shelf from Station "+was);
    } else {
      if(h.station===target) return;
      h.station=target; save(); paintHwSetup(); toast(h.name+" placed at Station "+target);
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-id]"),function(el){
    el.ondragstart=function(e){ e.dataTransfer.setData("text/plain", el.dataset.id); e.dataTransfer.effectAllowed="move"; el.classList.add("dragging"); };
    el.ondragend=function(){ el.classList.remove("dragging"); };
    el.onclick=function(e){
      e.stopPropagation();
      store.sel = (store.sel===el.dataset.id) ? null : el.dataset.id; save(); paintHwSetup();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-drop]"),function(z){
    const t = z.dataset.drop==="pool" ? "pool" : Number(z.dataset.drop);
    z.ondragover=function(e){ e.preventDefault(); z.classList.add("over"); };
    z.ondragleave=function(){ z.classList.remove("over"); };
    z.ondrop=function(e){ e.preventDefault(); z.classList.remove("over"); place(e.dataTransfer.getData("text/plain"), t); };
    z.onclick=function(){ if(store.sel){ const id=store.sel; store.sel=null; place(id, t); } };
  });
}

function muiSelect(id,label,opts,sel){
  return '<div class="mui"><label>'+esc(label)+'</label><select id="'+id+'">' +
    opts.map(function(o){ return '<option'+(o===sel?" selected":"")+'>'+esc(o)+'</option>'; }).join("") + '</select></div>';
}

 "1998-99 Upper Deck Encore #95 Michael Jordan Refractor",
 "2008-09 NBA Upper Deck Lineage #MJ-5 Michael Jordan",
 "1992-93 Upper Deck McDonalds #P5 Michael Jordan",
 "1995-96 Collector's Choice #353 Michael Jordan Playoff Time",
 "1996-97 Upper Deck #139 Michael Jordan",
 "1990-91 Skybox #41 Michael Jordan",
 "1993-94 Upper Deck #23 Michael Jordan",
 "1997-98 Metal Universe #23 Michael Jordan",
 "1991-92 Fleer #211 Michael Jordan League Leaders",
 "1994-95 Collector's Choice #240 Michael Jordan"
];
function boxCards(order){
  const n=25, out=[];
  for(let i=0;i<n;i++){
    out.push({num:"8AC00413"+(7848+i), status:"Pending Scan", slab:false, protector:false,
              note:CARDNAMES[i%CARDNAMES.length], player:""});
  }
  return out;
}
function scanStation(order){
  markNav("Operations","scan");
  if(!store.box || store.box.order!==order){
    store.box={order:order, id:6830, bin:9859, cards:boxCards(order), bay:[], mode:"V600", scanner:"", printer:""};
    save();
  }
  const b=store.box;
  const recs=hwRecords();
  const su=stationUsers();
  const DEMO="Eli Meyers";
  if(!b.station){
    const his=Object.keys(su).filter(function(k){ return su[k]===DEMO; })[0];
    b.station = his ? Number(his) : (stationList()[0]||1);
    save();
  }
  const scanners=devicesAt(b.station).filter(function(h){ return h.type!=="Printer"; });
  const printer=devicesAt(b.station).filter(function(h){ return h.type==="Printer"; })[0];
  const done=b.cards.filter(function(c){ return c.status!=="Pending Scan"; }).length;
  const label = printer ? ("station_"+b.station+"_fj") : "no printer";

  view.innerHTML =
    '<button class="backlink" id="back">&larr; Pending Scan</button>' +
    '<div class="spage"><div class="sleft">' +
    '<div class="station">' +
      '<section class="stpanel">' +
        '<div class="toprow">' +
          '<div class="toggleline"><b>Fuji</b>' +
            '<button class="toggle'+(b.mode==="V600"?" on":"")+'" id="mode"><i></i></button>' +
            '<b>V600</b></div>' +
          '<label class="ctlfield"><span>Scanner station</span><select class="ctlsel" id="station">' +
          stationList().map(function(n){
            return '<option value="'+n+'"'+(n===b.station?" selected":"")+'>Station '+n+(su[n]?" — "+esc(su[n]):" — unassigned")+'</option>';
          }).join("") + '</select></label>' +
        '</div>' +
        '<p class="stationline">'+(su[b.station]?esc(su[b.station]):"No user assigned")+'</p>' +
        '<p class="minilbl">Scanners</p>' +
        (scanners.length ? scanners.map(function(h,k){
          const filled=b.bay.slice(k*6,k*6+6).filter(Boolean).length;
          return '<div class="scrow'+(k===(b.sel||0)?" picked":"")+'" data-pick="'+k+'" tabindex="0" role="button" aria-label="'+esc(h.name)+'"><span class="nm">'+esc(h.name)+'<em>'+esc(h.type)+(filled?" &middot; "+filled+"/6":"")+'</em></span>' +
                 '<button class="mini scan" data-sc="'+k+'" tabindex="-1">Scan</button>' +
                 '<button class="mini load" data-ld="'+k+'" tabindex="-1">Load</button></div>';
        }).join("") : '<p class="note">No scanners at this station.</p>') +
        '<p class="minilbl">Printer</p>' +
        '<div class="printerbox">'+(printer?("Printer "+esc(printer.name)+" &middot; "+esc(label)):"No printer")+'</div>' +
        '<div class="ctlgrid">' +
          '<button class="bigbtn green" id="scan">SCAN ALL</button>' +
          '<button class="bigbtn yellow" id="loadall">LOAD ALL</button>' +
          '<button class="bigbtn ghost" id="clear">CLEAR ALL</button>' +
          '<button class="bigbtn blue" id="printall">PRINT ALL</button>' +
        '</div>' +
      '</section>' +
      '<section class="bays" id="bays">' + (scanners.length ? scanners.map(function(h,k){
        return '<div class="bay'+(k===(b.sel||0)?" picked":"")+'" data-bay="'+k+'"><h5>'+esc(h.name)+'<em>'+esc(h.type)+'</em></h5><div class="tray"><div class="sweep"></div>' +
          [0,1,2,3,4,5].map(function(i){
            const slot=b.bay[k*6+i], shot=(b.shot||{})[k*6+i];
            return '<div class="cardslot'+(slot?" filled":"")+(shot?" shot":"")+'">' +
              (shot?'<img src="'+scanImg(k*6+i)+'" alt="">':'') +
              (slot?'<span>'+esc(order)+'<br>Position '+slot+'</span>':'') + '</div>';
          }).join("") + '</div></div>';
      }).join("") : '<div class="empty">No scanners at Station '+b.station+'. Add them on the Hardware tab.</div>') + '</section>' +
    '</div>' +

    '<div class="boxesbar">Boxes</div>' +
    '<div class="boxhead">' +
      '<h3>Box #'+b.id+' Oldest</h3>' +
      '<p><b>Bin:</b> #'+b.bin+'</p>' +
      '<p><b>Cards:</b> '+b.cards.length+'</p>' +
      '<span class="pill '+(done===b.cards.length?"purple":"green")+'">'+(done===b.cards.length?"Pending Grading":"Pending Scan")+'</span>' +
      '<span class="pill grey">None</span>' +
      '<button class="bigbtn ghost sm" id="return">RETURN BOX</button>' +
      '<span class="prog">'+done+' / '+b.cards.length+' scanned</span>' +
    '</div>' +
    '<div class="tablewrap"><table class="dt cardtable"><thead><tr>' +
      '<th>Action</th><th>F</th><th>FX</th><th>B</th><th>BX</th><th>#</th><th>Note</th>' +
      '<th>Player</th><th>Status</th><th>Is Slab</th><th>Number</th><th>Protector</th><th>Potential Fake</th>' +
    '</tr></thead><tbody id="cardrows"></tbody></table></div>' +
    '</div>' +
      '<aside class="preview">' +
        (scanners.length
          ? '<h5 class="prevhead">'+esc(scanners[b.sel||0] ? scanners[b.sel||0].name : "")+'</h5>' +
            '<div class="pgrid">' + [0,1,2,3,4,5].map(function(i){
              const k=(b.sel||0), pos=b.bay[k*6+i], shot=(b.shot||{})[k*6+i];
              return '<div class="pcard'+(pos?" filled":"")+(shot?" shot":"")+'">' +
                (shot?'<img src="'+scanImg(k*6+i)+'" alt="">':'') +
                (pos?'<span>Order: '+esc(order)+'<br>Position: '+pos+'</span>':'<span class="dim">empty</span>')+'</div>';
            }).join("") + '</div>'
          : '<p class="note">No scanner selected</p>') +
    '</div>';

  function rows(){
    document.getElementById("cardrows").innerHTML = b.cards.map(function(c,i){
      return '<tr>' +
        '<td class="acts"><button class="mini load" data-load="'+i+'">Load</button><button class="mini print" data-print="'+i+'">Print</button></td>' +
        '<td class="tick">'+(c.status!=="Pending Scan"?"&#10003;":"&ndash;")+'</td>' +
        '<td class="tick"><button class="trash" data-del-img="'+i+'">&#128465;</button></td>' +
        '<td class="tick">'+(c.status!=="Pending Scan"?"&#10003;":"&ndash;")+'</td>' +
        '<td class="tick"><button class="trash" data-del-img="'+i+'">&#128465;</button></td>' +
        '<td>'+(i+1)+'</td><td>'+esc(c.note)+'</td><td>'+esc(c.player)+'</td>' +
        '<td><span class="pill '+(c.status==="Pending Scan"?"green":"purple")+'">'+esc(c.status)+'</span></td>' +
        '<td class="no">'+(c.slab?'<b>YES</b>':'&#10007; NO')+'</td>' +
        '<td class="mono">'+esc(c.num)+'</td>' +
        '<td><button class="sw'+(c.protector?" on":"")+'" data-prot="'+i+'"><i></i></button></td>' +
        '<td><button class="sw'+(c.fake?" on":"")+'" data-fake="'+i+'"><i></i></button></td>' +
      '</tr>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-prot],[data-fake]"),function(el){
      el.onclick=function(){
        const k=el.dataset.prot!==undefined?"protector":"fake";
        const i=Number(el.dataset.prot!==undefined?el.dataset.prot:el.dataset.fake);
        b.cards[i][k]=!b.cards[i][k]; save(); rows();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del-img]"),function(el){
      el.onclick=function(){ toast("Image cleared on card "+(Number(el.dataset.delImg)+1)); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-load]"),function(el){
      el.onclick=function(){ toast("Loaded card "+(Number(el.dataset.load)+1)+" to "+(scanners[0]?scanners[0].name:"the station")); };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-print]"),function(el){
      el.onclick=function(){ toast("Sent card "+(Number(el.dataset.print)+1)+" to "+label); };
    });
  }
  rows();

  Array.prototype.forEach.call(document.querySelectorAll("[data-ld]"),function(el){
    el.onclick=function(e){
      e.stopPropagation();
      const k=Number(el.dataset.ld);
      if(!b.shot) b.shot={};
      for(let i=0;i<6;i++){ b.bay[k*6+i]=k*6+i+1; delete b.shot[k*6+i]; }
      save();
      const bay=document.querySelectorAll("[data-bay]")[k];
      if(bay) Array.prototype.forEach.call(bay.querySelectorAll(".cardslot"),function(cell,i){
        cell.className="cardslot filled";
        cell.innerHTML='<span>'+order+'<br>Position '+b.bay[k*6+i]+'</span>';
      });
      const row=document.querySelectorAll("[data-pick]")[k];
      if(row){ const em=row.querySelector(".nm em"); if(em) em.innerHTML=esc(scanners[k].type)+" &middot; 6/6"; }
      pick(k); renderPreview();
      toast("Loaded 6 into "+scanners[k].name);
    };
  });
  const running={};
  function renderPreview(){
    const prev=document.querySelector(".preview"); if(!prev) return;
    const k=b.sel||0;
    if(!b.side) b.side={};
    if(!b.rescan) b.rescan={};
    prev.innerHTML = scanners.length
      ? '<h5 class="prevhead">'+esc(scanners[k]?scanners[k].name:"")+'</h5>' +
        '<div class="pgrid">' + [0,1,2,3,4,5].map(function(i){
          const idx=k*6+i, pos=b.bay[idx], shot=(b.shot||{})[idx];
          const side=b.side[idx]||"F", need=b.rescan[idx];
          return '<div class="pcard'+(pos?" filled":"")+(shot?" shot":"")+(need?" need":"")+'" data-slot="'+idx+'">' +
            '<div class="sweep"></div>' +
            (shot?'<img src="'+scanImg(idx)+'" alt="">':'') +
            (pos?'<span>Order: '+esc(order)+'<br>Position: '+pos+(need?'<br><b>rescan '+(side==="F"?"front":"back")+'</b>':'')+'</span>'
                :'<span class="dim">empty</span>') +
            (pos?'<div class="pctl">' +
                 '<button data-pside="'+idx+'" title="front or back">'+side+'</button>' +
                 '<button data-pscan="'+idx+'" title="scan this position">Scan</button>' +
                 '<button data-pclr="'+idx+'" title="clear this position">Clear</button>' +
                 '</div>':'') +
          '</div>';
        }).join("") + '</div>'
      : '<p class="note">No scanner selected</p>';

    Array.prototype.forEach.call(prev.querySelectorAll("[data-pside]"),function(el){
      el.onclick=function(e){
        e.stopPropagation();
        const idx=Number(el.dataset.pside);
        b.side[idx]=(b.side[idx]||"F")==="F"?"B":"F"; save(); renderPreview();
      };
    });
    Array.prototype.forEach.call(prev.querySelectorAll("[data-pclr]"),function(el){
      el.onclick=function(e){
        e.stopPropagation();
        const idx=Number(el.dataset.pclr);
        if(!b.shot) b.shot={};
        delete b.shot[idx]; b.rescan[idx]=true; save();
        const bay=document.querySelectorAll("[data-bay]")[Math.floor(idx/6)];
        if(bay){
          const cell=bay.querySelectorAll(".cardslot")[idx%6];
          if(cell){ cell.classList.remove("shot"); cell.innerHTML='<span>'+order+'<br>Position '+b.bay[idx]+'</span>'; }
        }
        renderPreview(); toast("Position "+b.bay[idx]+" cleared — flagged for rescan");
      };
    });
    Array.prototype.forEach.call(prev.querySelectorAll("[data-pscan]"),function(el){
      el.onclick=function(e){ e.stopPropagation(); soloScan(Number(el.dataset.pscan)); };
    });
  }

  function soloScan(idx){
    if(!b.bay[idx]){ toast("Nothing loaded in that position"); return; }
    if(running["solo"+idx]) return;
    running["solo"+idx]=true;
    const card=document.querySelector('.pcard[data-slot="'+idx+'"]');
    if(card) card.classList.add("scanning");
    const btn=document.querySelector('[data-pscan="'+idx+'"]');
    if(btn) btn.disabled=true;
    setTimeout(function(){
      running["solo"+idx]=false;
      if(!b.shot) b.shot={};
      b.shot[idx]=true; delete b.rescan[idx];
      const c=b.cards.filter(function(x){ return x.status==="Pending Scan"; })[0];
      if(c) c.status="Pending Grading";
      save(); rows();
      const bay=document.querySelectorAll("[data-bay]")[Math.floor(idx/6)];
      if(bay){
        const cell=bay.querySelectorAll(".cardslot")[idx%6];
        if(cell){
          cell.classList.add("shot");
          cell.innerHTML='<img src="'+scanImg(idx)+'" alt="">'+'<span>'+order+'<br>Position '+b.bay[idx]+'</span>';
        }
      }
      renderPreview();
      toast("Position "+b.bay[idx]+" scanned ("+((b.side[idx]||"F")==="F"?"front":"back")+")");
    }, 2200);
  }

  function pick(k){
    if(b.sel===k) return;
    b.sel=k; save();
    Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"),function(x){ x.classList.toggle("picked", Number(x.dataset.pick)===k); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-bay]"),function(x){ x.classList.toggle("picked", Number(x.dataset.bay)===k); });
    renderPreview();
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"),function(el){
    const k=Number(el.dataset.pick);
    el.onclick=function(e){
      if(e.target.closest("[data-sc],[data-ld]")) return;
      pick(k);
    };
    el.onfocus=function(){ pick(k); };
    el.onkeydown=function(e){
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); const s=el.querySelector("[data-sc]"); if(s&&!s.disabled) s.click(); }
      if(e.key==="l"||e.key==="L"){ e.preventDefault(); const l=el.querySelector("[data-ld]"); if(l&&!l.disabled) l.click(); }
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){
        e.preventDefault();
        const all=document.querySelectorAll("[data-pick]");
        const next=all[(k + (e.key==="ArrowDown"?1:all.length-1)) % all.length];
        if(next) next.focus();
      }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-bay]"),function(el){
    el.onclick=function(){ pick(Number(el.dataset.bay)); };
  });
  function setBusy(k,on){
    const row=document.querySelectorAll("[data-pick]")[k];
    if(!row) return;
    row.classList.toggle("busy",on);
    Array.prototype.forEach.call(row.querySelectorAll(".mini"),function(x){ x.disabled=on; });
  }
  function rowCount(k){
    const row=document.querySelectorAll("[data-pick]")[k];
    if(!row||!scanners[k]) return;
    const filled=b.bay.slice(k*6,k*6+6).filter(Boolean).length;
    const em=row.querySelector(".nm em");
    if(em) em.innerHTML=esc(scanners[k].type)+(filled?" &middot; "+filled+"/6":"");
  }
  function runScan(ks){
    if(!b.shot) b.shot={};
    const bays=document.querySelectorAll("[data-bay]");
    const live=ks.filter(function(k){
      return !running[k] && b.bay.slice(k*6,k*6+6).filter(Boolean).length;
    });
    if(!live.length){
      toast(ks.some(function(k){ return running[k]; }) ? "That scanner is already running" : "Load the scanner first");
      return;
    }
    live.forEach(function(k){
      running[k]=true;
      if(bays[k]) bays[k].classList.add("scanning");
      setBusy(k,true);
      let n=0;
      const t=setInterval(function(){
        if(!document.querySelector("[data-bay]")){ clearInterval(t); running[k]=false; return; }
        const idx=k*6+n;
        if(b.bay[idx]){
          b.shot[idx]=true;
          const cell=bays[k].querySelectorAll(".cardslot")[n];
          if(cell){
            cell.classList.add("shot");
            cell.innerHTML='<img src="'+scanImg(idx)+'" alt="">' +
              '<span>'+order+'<br>Position '+b.bay[idx]+'</span>';
          }
          const c=b.cards.filter(function(x){ return x.status==="Pending Scan"; })[0];
          if(c) c.status="Pending Grading";
          rows();
          if((b.sel||0)===k) renderPreview();
        }
        n++;
        if(n>=6){
          clearInterval(t);
          running[k]=false;
          if(bays[k]) bays[k].classList.remove("scanning");
          setBusy(k,false); rowCount(k); save();
          toast(scanners[k].name+" done");
        }
      }, 950);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-sc]"),function(el){
    el.onclick=function(e){ e.stopPropagation(); runScan([Number(el.dataset.sc)]); };
  });
  document.onkeydown=function(e){
    if(e.key!=="Tab") return;
    const rows=document.querySelectorAll("[data-pick]");
    if(!rows.length) return;
    e.preventDefault();
    const cur=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.pick : null;
    let i = cur===undefined||cur===null ? (b.sel||0) : Number(cur)+(e.shiftKey?-1:1);
    i=(i+rows.length)%rows.length;
    rows[i].focus();
  };
  syncPanel();
  document.getElementById("back").onclick=function(){ go("#/p/scan/scan"); };
  document.getElementById("mode").onclick=function(){
    b.mode = b.mode==="V600" ? "Fuji" : "V600"; save(); scanStation(order);
  };
  document.getElementById("station").onchange=function(){
    b.station=Number(this.value); b.bay=[]; save(); scanStation(order);
    toast("Station "+b.station+(su[b.station]?" — "+su[b.station]:""));
  };
  document.getElementById("loadall").onclick=function(){
    if(Object.keys(running).some(function(k){ return running[k]; })){ toast("Wait for the running scanner to finish"); return; }
    const slots=scanners.length*6, arr=[];
    for(let i=1;i<=slots;i++) arr.push(i);
    b.bay=arr; b.shot={}; save(); scanStation(order);
  };
  document.getElementById("clear").onclick=function(){
    if(Object.keys(running).some(function(k){ return running[k]; })){ toast("Wait for the running scanner to finish"); return; }
    b.bay=[]; b.shot={}; b.cards.forEach(function(c){ c.status="Pending Scan"; }); save(); scanStation(order); toast("Cleared");
  };
  document.getElementById("printall").onclick=function(){ toast(printer?("Printing "+b.cards.length+" labels on "+label):"No printer at this station"); };
  document.getElementById("return").onclick=function(){ toast("Box #"+b.id+" returned to bin #"+b.bin); };
  document.getElementById("scan").onclick=function(){
    return runScan(scanners.map(function(_,i){ return i; }));
  };

    close();
    if(kind==="revault"){
      if(bin.items) bin.items.unshift({num:num, slot:toSlot, f:0, b:1, slab:(face===SLAB?1:(face===SLAB4?4:2)), art:face});
      bin.justIn=toSlot;
      bin.cards=(bin.cards||0)+1; bin.next=nextSlot(bin); save(); viewRevault();
      toast(num+" moved to Bin "+toBin+" · Slot "+toSlot);
    } else {
      toast("Sent to "+(kind==="data"?"data review":"customer support"));
    }
  };
}

function viewRevault(){
  markNav("Vaulting","revault");
  if(!hasSkill("Revault")){
    view.innerHTML =
      '<div class="lockcard"><h2>Revault is locked</h2>' +
      '<p>Your account does not have the Revault skill, so the page does not open from the Vaulting menu. ' +
      'An admin can turn it on from your grader page.</p>' +
      '<button class="actbtn blue" id="rv-lock">Open Alan Bailey in Graders</button></div>';
    document.getElementById("rv-lock").onclick=function(){ go("#/graders/"+ME); };
    return;
  }
  const bin=store.revault || (store.revault={bin:653, kind:"Storage", cards:5, next:4, storage:null, shipping:null, name:"", loc:""});
  view.innerHTML =
    '<div class="rv">' +
      '<h1 class="left" style="margin-bottom:6px">Revault Items</h1>' +
      '<p class="note" style="margin:0 0 18px">Move a vaulted card into a different storage bin. The card stays vaulted — only its bin and slot change.</p>' +
      '<div class="catrow"><span class="catlbl">CATEGORY</span>' +
        '<div class="segmented"><button class="on">&#10003; CARDS</button>' +
        '<button class="dimbtn" disabled>WATCHES <em>COMING SOON</em></button></div>' +
      '</div>' +
      '<div class="scancards">' +
        '<button class="scancard" data-target="storage"><h3>'+(bin.storage?("Storage Bin "+esc(bin.storage)+(bin.name?" &middot; "+esc(bin.name):"")):"No Storage Bin")+'</h3><p>'+(bin.storage&&bin.loc?esc(bin.loc):"Scan QR Code")+'</p></button>' +
        '<button class="scancard" data-target="shipping"><h3>'+(bin.shipping?("Shipping Bin "+esc(bin.shipping)):"No Shipping Bin")+'</h3><p>Scan QR Code</p></button>' +
      '</div>' +
      (bin.storage ? '<div class="binbar">' +
        '<b>Bin: '+bin.bin+'</b>'+(bin.name?'<b class="binname">'+esc(bin.name)+'</b>':'')+
        '<span class="kind">'+esc(bin.kind)+'</span><b>Cards: ('+bin.cards+')</b>' +
        (bin.loc?'<span class="binloc">'+esc(bin.loc)+'</span>':'') +
        '<span class="spacer"></span>' +
        '<span class="nextslot">Next slot: <b>'+nextSlot(bin)+'</b></span>' +
        '<button class="btn-out" id="rv-bin">CHANGE BIN</button>' +
      '</div>' : '') +
      (bin.items && bin.items.length
        ? '<div class="tablewrap bincontents"><table class="dt bintable"><thead><tr>' +
            '<th>Front</th><th>Back</th><th>Number</th><th>Slot</th></tr></thead><tbody>' +
          bin.items.slice().sort(function(a,b){ return b.slot-a.slot; }).map(function(it){
            const art = it.art || (it.slab===4 ? SLAB4 : (it.slab===2 ? SLAB2 : (it.slab ? SLAB : null)));
            return '<tr'+(bin.justIn===it.slot?' class="justin"':'')+'><td><img class="thumb" src="'+(art?art[0]:scanImg(it.f))+'" alt=""></td>' +
                   '<td><img class="thumb" src="'+(art?art[1]:scanImg(it.b))+'" alt=""></td>' +
                   '<td><button class="olink">'+esc(it.num)+'</button></td>' +
                   '<td class="slot">'+it.slot+'</td></tr>';
          }).join("") + '</tbody></table></div>'
        : '') +
      '<div class="campanel" id="campanel">' +
        '<div class="camhead"><span id="camlbl">Camera off</span>' +
          '<button class="mini scan" id="camtoggle">Start</button></div>' +
        '<div class="demogrid">' +
          '<span class="demolbl">Bins</span>' +
          '<button class="mini load" data-bin="4411">Bin 4411 · Leaf</button>' +
          '<button class="mini load" data-bin="5310">Bin 5310 · Aspen</button>' +
          '<span class="demolbl">Cards</span>' +
          '<button class="mini" data-card="revault" style="background:#157f6e">Revault card</button>' +
          '<button class="mini" data-card="data" style="background:#b8544c">Data issue</button>' +
          '<button class="mini" data-card="support" style="background:#8b2fe0">Customer support</button>' +
          '<button class="mini" id="demoreset" style="background:#41464e">Reset demo</button>' +
        '</div>' +
        '<video id="cam" playsinline muted></video>' +
        '<button class="camshot" id="camshot" title="Capture">&#9673;</button>' +
      '</div>' +
      '<button class="qrfab" id="qrfab" title="Scan QR">&#9635;</button>' +
    '</div>';

  let target="storage";
  Array.prototype.forEach.call(view.querySelectorAll("[data-target]"),function(el){
    el.onclick=function(){
      target=el.dataset.target;
      Array.prototype.forEach.call(view.querySelectorAll("[data-target]"),function(x){ x.classList.toggle("on", x===el); });
      toast("Scan a QR code for the "+target+" bin");
      startCam();
    };
  });
  if(bin.justIn!=null){
    const hit=view.querySelector(".bintable tr.justin");
    if(hit && hit.scrollIntoView) requestAnimationFrame(function(){
      hit.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }
  const binBtn=document.getElementById("rv-bin");
  if(binBtn) binBtn.onclick=function(){
    modal("Change bin",
      '<div class="mui"><label>Bin number</label><input id="m-bin" value="'+bin.bin+'" inputmode="numeric"></div>' +
      '<div class="rowset" style="margin:18px 0 0">' +
        muiSelect("m-kind","Bin type",["Storage","Shipping","Office"],bin.kind) +
        '<div class="mui"><label>Next slot</label><input id="m-next" value="'+bin.next+'" inputmode="numeric"></div>' +
      '</div>',
      function(w){
        bin.bin=Number(w.querySelector("#m-bin").value)||bin.bin;
        bin.kind=w.querySelector("#m-kind").value;
        bin.next=Number(w.querySelector("#m-next").value)||bin.next;
        save(); viewRevault(); toast("Bin "+bin.bin);
      });
  };
  document.getElementById("qrfab").onclick=startCam;
  Array.prototype.forEach.call(view.querySelectorAll("[data-bin]"),function(el){
    el.onclick=function(){
      stopCam();
      el.dataset.bin==="5310" ? loadBin("5310","Aspen","Davos Shelf#612 Inch") : loadBin("4411");
    };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-card]"),function(el){
    el.onclick=function(){ cardDialog(el.dataset.card, bin); };
  });
  document.getElementById("demoreset").onclick=function(){
    stopCam();
    delete store.revault; delete store.demoK; delete store.demoCard;
    save(); viewRevault(); toast("Demo reset — nothing scanned");
  };
  const lbl=document.getElementById("camlbl");
  const toggle=document.getElementById("camtoggle");
  toggle.onclick=function(){ camStream ? (stopCam(), paintCam()) : startCam(); };
  function loadBin(code,name,loc){
    bin.storage=code; bin.bin=Number(code)||bin.bin; bin.kind="Storage";
    bin.name=name||"Leaf"; bin.loc=loc||"Davos Shelf#555 Inch";
    bin.items=binItems(code); bin.cards=69; bin.next=nextSlot(bin); delete bin.justIn;
    save(); viewRevault();
    toast("Storage bin "+code+" — "+bin.items.length+" slots shown");
  }
  window.__loadBin=loadBin;
  document.getElementById("camshot").onclick=function(){
    if(target==="storage"){
      loadBin(bin.storage ? String(4400+Math.floor(Math.random()*90)) : "4411");
      return;
    }
    {
      const code = "SH-"+(700+Math.floor(Math.random()*90));
      bin.shipping=code; save(); viewRevault();
      toast("Shipping bin "+code+(camStream?" scanned":" entered (camera off)"));
    }
  };
  function paintCam(){
    lbl.textContent = camStream ? "Camera live" : "Camera off";
    toggle.textContent = camStream ? "Stop" : "Start";
    document.getElementById("campanel").classList.toggle("live", !!camStream);
  }
  function startCam(){
    if(camStream) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      lbl.textContent="No camera API"; toast("This browser blocks camera access here"); return;
    }
    lbl.textContent="Starting…";
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})
      .then(function(st){
        camStream=st;
        const v=document.getElementById("cam");
        if(!v){ stopCam(); return; }
        v.srcObject=st; v.play().catch(function(){});
        paintCam(); readQR();
      })
      .catch(function(e){
        lbl.textContent = e && e.name==="NotAllowedError" ? "Permission denied" : "Camera unavailable";
        toast("Camera blocked — allow access, or open the deployed page over https");
      });
  }
  function readQR(){
    const v=document.getElementById("cam");
    if(!v || typeof jsQR!=="function") return;
    const cv=document.createElement("canvas"), cx=cv.getContext("2d", {willReadFrequently:true});
    (function tick(){
      if(!camStream || !document.getElementById("cam")) return;
      if(v.videoWidth){
        cv.width=v.videoWidth; cv.height=v.videoHeight;
        cx.drawImage(v,0,0,cv.width,cv.height);
        let hit=null;
        try{
          const img=cx.getImageData(0,0,cv.width,cv.height);
          hit=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
        }catch(e){}
        if(hit && hit.data){
          const txt=hit.data.trim();
          const num=(txt.match(/\d{3,6}/)||[])[0];
          if(target==="storage" && num){ stopCam(); loadBin(num); return; }
          if(target==="shipping"){ bin.shipping=txt.slice(0,16); save(); viewRevault(); toast("Shipping bin "+bin.shipping); return; }
        }
      }
      setTimeout(function(){ requestAnimationFrame(tick); }, 220);
    })();
  }
  paintCam();
  startCam();
}

/* ===================== graders ===================== */
function viewGraders(){
  markNav("Graders");
  view.innerHTML =
    '<h1 class="mid">Graders</h1>' +
    '<div class="field"><label for="q">Search Users</label><input id="q" autocomplete="off"></div>' +
    '<div class="gtable"><div class="ghead"><span>User &uarr;</span><span>Created At</span></div><div id="rows"></div></div>';
  const rows=document.getElementById("rows");
  function paint(f){
    f=(f||"").toLowerCase();
    const list=GRADERS.filter(function(g){ return !f || g[1].toLowerCase().indexOf(f)>-1 || g[2].toLowerCase().indexOf(f)>-1; });
    if(!list.length){ rows.innerHTML='<div class="empty">No user matches that search.</div>'; return; }
    rows.innerHTML=list.map(function(g){
      const ini=g[1].split(" ").map(function(w){return w[0];}).slice(0,2).join("");
      return '<div class="grow"><button class="gpill" data-id="'+g[0]+'"><span class="ini">'+esc(ini)+'</span>' +
             '<span><b>'+esc(g[1])+'</b><small>'+esc(g[2])+'</small></span></button>' +
             '<div class="gdate">'+esc(g[3])+'</div></div>';
    }).join("");
    Array.prototype.forEach.call(rows.querySelectorAll(".gpill"),function(b){
      b.onclick=function(){ go("#/graders/"+b.dataset.id); };
    });
  }
  paint("");
  document.getElementById("q").oninput=function(){ paint(this.value); };
}

function viewGrader(id){
  markNav("Graders");
  const g=GRADERS.filter(function(x){ return x[0]===id; })[0];
  if(!g) return go("#/graders");
  const s=skillsFor(id);
  view.innerHTML =
    '<h1 class="mid">'+esc(g[1])+'</h1>' +
    '<div class="skills" id="grid"></div><div class="log" id="log"></div>';
  const grid=document.getElementById("grid");
  SKILLS.forEach(function(x){
    const n=x[0], b=document.createElement("button");
    function style(){ b.className="skill "+(s[n]?"on":"off"); b.setAttribute("aria-pressed",s[n]?"true":"false"); }
    b.textContent=n; style();
    b.onclick=function(){
      s[n]=!s[n]; save(); style();
      if(n==="Hardware"&&id===ME) toast(s[n]?"Hardware enabled — the tab is on Pending Scan":"Hardware disabled — the tab is hidden");
      if(n==="Revault"&&id===ME) toast(s[n]?"Revault enabled — open it from Vaulting":"Revault disabled — the page is locked");
    };
    grid.appendChild(b);
  });
  document.getElementById("log").innerHTML=LOG.map(function(l){
    return '<div class="item"><h3>&#9993; '+esc(l[0])+' | '+esc(g[1])+'</h3>' +
           '<p class="bullet">&bull; '+esc(l[1])+'</p><p class="ts">'+esc(l[2])+'</p></div>';
  }).join("");
}

/* ===================== home ===================== */
function viewHome(){
  markNav(null);
  view.innerHTML = '<div class="home"><h2>In Progress (0)</h2></div>';
}

/* ===================== router ===================== */
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(!parts.length) return viewHome();
  if(parts[0]==="home") return viewHome();
  if(parts[0]!=="revault") stopCam();
  if(parts[0]==="revault") return viewRevault();
  if(parts[0]==="box") return scanStation(decodeURIComponent(parts[1]||""));
  if(parts[0]==="graders") return parts[1]?viewGrader(parts[1]):viewGraders();
  if(parts[0]==="create-admin") return viewCreateAdmin();
  if(parts[0]==="p") return viewPage(parts[1], parts[2]);
  return viewHome();
}

buildNav();
window.addEventListener("hashchange",route);
route();
})();
